<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
    <!--Display: bloco embutido -->
    <div class="inline-block">a</div>
    <div class="inline-block">b</div>
    <div class="inline-block">c</div>

    <!-- posicao sticky -->
     <div class="sticky">
        <span>Sou um elemento</span>
     </div>

    <!--Display:bloco de exibiçao-->
    <div class="block">e</div>
    <div class="block">f</div>
     <div class="block">e</div>
      <div class="block">f</div>
    <div class="block">e</div>
     <div class="block">f</div>




    <!--Escondendo o elemento -->
    <p class="escondendo">Esse paragrafo deve se esconder</p>

    <!--posicao Estetica -->
    <div class="static">
       <span>sou um elemento estatico</span>
       </div> 

       <!--posicao Relativa -->
    <div class="relativa">
       <span>sou um elemento estatico</span>
       </div> 

       <!--posicao absoluta -->
       <div class="absoluto">
        <span>Sou um elemento absolite</span>
       </div>

<!--posicao Relativa com absoluta-->
<div class="bloco-relativo">
    <div class="bloco-absoluto1"></div>
     <div class="bloco-absoluto2"></div>
 </div>    


 <!--z-index -->
 <div class="bloco-relativo">
   <div class="bloco-absoluto3"></div>
   <div class="bloco-absoluto4"></div>
   <div class="bloco-absoluto5"></div>
</div>

</body>
</html>
